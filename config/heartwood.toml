[scan]
title = "Heartwood API Security Checks"
wrong_audience_token_command = "az account get-access-token --resource-type ms-graph --query accessToken -o tsv"
request_timeout_seconds = 20
exempt_path_patterns = [
  "/api/*/health",
  "/ops/health/*"
]

[frontdoor_defaults]
resource_group = "rg-shared-prod-cac"
profile_name = "afd-rtip-prod"
endpoint_name = "hw-api-internal-prod"
base_url = "https://api.internal.heartwoodfinancial.ca"

