[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-security-checks"
version = "0.1.0"
description = "Repeatable Azure API endpoint discovery and auth-gate security checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Devin Corey" }
]
dependencies = []

[project.scripts]
api-security-checks = "api_security_checks.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
